name: ci

on:
  push:
    tags:
      - "v*"

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Stub croisé (GOOS=linux, CGO_ENABLED=0)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vue Windows
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go test ./...
